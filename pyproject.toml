[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flockcare"
version = "0.1.0"
description = "Acoustic AI respiratory disease screening for backyard poultry flocks"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "librosa>=0.10.0",
    "numpy>=1.23.0",
    "pandas>=1.5.0",
    "soundfile>=0.12.1",
    "scipy>=1.9.0",
    "tqdm>=4.65.0",
]

[tool.setuptools.packages.find]
include = ["ml*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
